[package]
name = "cargo-nightly"
description = "Cargo subcommand to forward commands to the nightly toolchain, enabling nightly toolchain usage in cargo aliases"
version = "1.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
repository = "https://github.com/legra-ai/cargo-nightly"
documentation = "https://docs.rs/cargo-nightly"
homepage = "https://github.com/legra-ai/cargo-nightly"
rust-version = "1.94.1"
readme = "README.md"
keywords = ["cargo", "nightly", "toolchain", "cli", "alias"]
categories = ["command-line-utilities", "development-tools"]
publish = true

include = ["src/**", "tests/**", "build.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[[bin]]
name = "cargo-nightly"
path = "src/main.rs"

[dependencies]

[dev-dependencies]
async-fs-io = "0.2.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }

[build-dependencies]
rhusky = "2.0.1"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"
